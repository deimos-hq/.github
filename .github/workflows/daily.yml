name: daily (mission board, boarding pass, tonight's real Deimos)
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/org.py
      - run: |
          git config user.name "deimos mission control"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/assets
          git diff --cached --quiet || (git commit -m "mission board · $(date -u +%F)" && git push)
