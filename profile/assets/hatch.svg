<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Crimp is open: an open-source decision gate for AI agents; when a fact breaks, the decision withdraws itself."><defs><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .06"/></feComponentTransfer></filter><radialGradient id="inside"><stop offset="0" stop-color="#ffe3f7"/><stop offset=".6" stop-color="#ff2bd6" stop-opacity=".55"/><stop offset="1" stop-color="#2a0f24"/></radialGradient></defs><rect width="1280" height="320" rx="22" fill="#05040a"/><rect width="1280" height="320" rx="22" filter="url(#grain)"/><rect x="1" y="1" width="1278" height="318" rx="22" fill="none" stroke="#fff" stroke-opacity=".12"/><polygon points="320,90 1240,40 1240,280 320,230" fill="#ff2bd6" opacity="0"><animate attributeName="opacity" values="0;0;.07;.07;0" keyTimes="0;.32;.45;.9;1" dur="10s" repeatCount="indefinite"/></polygon><circle cx="230" cy="160" r="96" fill="#ff2bd6" opacity="0" filter="url(#soft)"><animate attributeName="opacity" values="0;0;.75;.75;0" keyTimes="0;.32;.45;.9;1" dur="10s" repeatCount="indefinite"/></circle><circle cx="230" cy="160" r="92" fill="url(#inside)"/><g><circle cx="230" cy="160" r="96" fill="#1c1a24" stroke="#4a4558" stroke-width="6"/><circle cx="230" cy="160" r="64" fill="none" stroke="#4a4558" stroke-width="3"/><rect x="180" y="154" width="100" height="12" rx="6" fill="#4a4558"/><animateTransform attributeName="transform" type="scale" values="1 1;1 1;.22 1;.22 1;1 1" ke