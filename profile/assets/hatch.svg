Menlo,Consolas,monospace" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0" >the facts, not a conclusion. When a fact breaks, the decision withdraws itself.</text><text x="422.0" y="192.0" fill="#f2f0ea" fill-opacity="0.55" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0" font-style="italic">In 2022, 83% of appealed Medicare Advantage prior-auth denials were overturned.</text><rect x="422" y="238" width="112" height="28" rx="14" fill="none" stroke="#ff2bd6" stroke-opacity=".6"/><text x="478.2" y="257.0" fill="#ff2bd6" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="middle" letter-spacing="1.5" >OPEN SOURCE</text><rect x="544.4" y="238" width="138" height="28" rx="14" fill="none" stroke="#ff2bd6" stroke-opacity=".6"/><text x="613.2" y="257.0" fill="#ff2bd6" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="middle" letter-spacing="1.5" >PATENT PENDING</text><rect x="692.0" y="238" width="138" height="28" rx="14" fill="none" stroke="#ff2bd6" stroke-opacity=".6"/><text x="760.8" y="257.0" fill="#ff2bd6" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="middle" letter-spacing="1.5" >OPENSSF SILVER</text></svg>